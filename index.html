<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Montagem & Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- HEADER HUD NEON -->
        <header class="hero-header">
            <div class="logo-container">
                <div class="logo-icon">🔧</div>
                <div>
                    <h1>CONTROLE DE MONTAGEM</h1>
                    <p class="subtitulo">// SISTEMA DE GESTÃO DE OFICINA</p>
                </div>
            </div>
            <div class="status-badge">
                <span class="dot-online"></span> ONLINE
            </div>
        </header>

        <!-- CARD 1: PAINEL DE ESTOQUE DE PEÇAS -->
        <section class="card">
            <h2>📦 Gestão de Estoque de Peças</h2>
            <div class="form-row" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div class="form-group" style="flex: 2;">
                    <label>Nome da Peça</label>
                    <input type="text" id="nomePecaEstoque" placeholder="Ex: Bendix, Induzido, Automático">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Quantidade</label>
                    <input type="number" id="qtdPecaEstoque" placeholder="Qtd" min="0">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn btn-add" onclick="adicionarEstoque()">Cadastrar Peça</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Peça</th>
                        <th>Qtd Atual</th>
                        <th>Status</th>
                        <th style="width: 80px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaEstoque"></tbody>
            </table>
        </section>

        <!-- CARD 2: REGISTRO DE MONTAGEM E SERVIÇO -->
        <section class="card">
            <h2>📝 Lançamento de Montagem</h2>
            
            <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Prefixo / Equipamento</label>
                    <input type="text" id="prefixo" placeholder="Ex: ARR-102">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Data do Serviço</label>
                    <input type="date" id="dataServico">
                </div>
            </div>

            <hr class="divisor">

            <h3>Adicionar Peças Utilizadas</h3>
            <div class="form-row" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div class="form-group" style="flex: 2;">
                    <label>Selecione a Peça do Estoque</label>
                    <select id="selectPecaEstoque">
                        <option value="">-- Selecione uma Peça --</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Qtd Usada</label>
                    <input type="number" id="qtdUsoPeca" value="1" min="1">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn btn-add" onclick="adicionarPecaServico()">+ Adicionar Peça</button>
                </div>
            </div>

            <table style="margin-bottom: 20px;">
                <thead>
                    <tr>
                        <th>Peça Adicionada</th>
                        <th>Qtd</th>
                        <th style="width: 80px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPecasTemp"></tbody>
            </table>

            <button class="btn btn-salvar" onclick="salvarServico()">💾 Registrar e Dar Baixa no Estoque</button>
        </section>

        <!-- CARD 3: HISTÓRICO E GERADOR DE PDF -->
        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>📋 Histórico de Registros</h2>
                <button class="btn btn-pdf" onclick="gerarPDF()">📄 Exportar Relatório em PDF</button>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <input type="text" id="busca" placeholder="🔍 Buscar por Prefixo ou Data..." onkeyup="filtrarHistorico()">
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Prefixo</th>
                        <th>Peças Utilizadas</th>
                        <th style="width: 80px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaHistorico"></tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
